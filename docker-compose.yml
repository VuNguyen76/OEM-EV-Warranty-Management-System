name: oem_ev_warranty 

services:
  # ===================== SHARED INIT =====================
  # Service để cài dependencies cho shared trước khi các services khác chạy
  shared-init:
    build: ./Backend/shared
    volumes:
      - ./Backend/shared:/shared
    command: sh -c "cd /shared && npm install --production && touch /shared/.dependencies-installed && tail -f /dev/null"
    healthcheck:
      test: ["CMD", "test", "-f", "/shared/.dependencies-installed"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - warranty_network

  api-gateway:
    build: ./Backend/api-gateway
    ports:
      - "${PORT_GATEWAY}:3000"
    environment:
      - USER_SERVICE_URL=http://user-service:${PORT_USER}
      - VEHICLE_SERVICE_URL=http://vehicle-service:${PORT_VEHICLE}
      - WARRANTY_SERVICE_URL=http://warranty-service:${PORT_WARRANTY}
      - PART_SERVICE_URL=http://part-service:${PORT_PART}
      - CAMPAIGN_SERVICE_URL=http://campaign-service:${PORT_CAMPAIGN}
      - ANALYTICS_SERVICE_URL=http://analytics-service:${PORT_ANALYTICS}
    depends_on:
      shared-init:
        condition: service_healthy
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      warranty-service:
        condition: service_started
      part-service:
        condition: service_started
      campaign-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared  

  # ===================== USER SERVICE =====================
  user-service:
    build: ./Backend/user-service
    ports:
      - "${PORT_USER}:${PORT_USER}"
    environment:
      - PORT=${PORT_USER}
      - MONGO_URI=${USER_DB}
      - SERVICE_NAME=user
    depends_on:
      shared-init:
        condition: service_healthy
      mongo-user:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared

  mongo-user:
    image: mongo:7.0
    volumes:
      - mongo_user_data:/data/db
    networks:
      - warranty_network

  # ===================== VEHICLE SERVICE =====================
  vehicle-service:
    build: ./Backend/vehicle-service
    ports:
      - "${PORT_VEHICLE}:${PORT_VEHICLE}"
    environment:
      - PORT=${PORT_VEHICLE}
      - MONGO_URI=${VEHICLE_DB}
      - SERVICE_NAME=vehicle
    depends_on:
      shared-init:
        condition: service_healthy
      mongo-vehicle:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared

  mongo-vehicle:
    image: mongo:7.0
    volumes:
      - mongo_vehicle_data:/data/db
    networks:
      - warranty_network

  # ===================== WARRANTY SERVICE =====================
  warranty-service:
    build: ./Backend/warranty-service
    ports:
      - "${PORT_WARRANTY}:${PORT_WARRANTY}"
    environment:
      - PORT=${PORT_WARRANTY}
      - MONGO_URI=${WARRANTY_DB}
      - SERVICE_NAME=warranty
    depends_on:
      shared-init:
        condition: service_healthy
      mongo-warranty:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared

  mongo-warranty:
    image: mongo:7.0
    volumes:
      - mongo_warranty_data:/data/db
    networks:
      - warranty_network

  # ===================== PART SERVICE =====================
  part-service:
    build: ./Backend/part-service
    ports:
      - "${PORT_PART}:${PORT_PART}"
    environment:
      - PORT=${PORT_PART}
      - MONGO_URI=${PART_DB}
      - SERVICE_NAME=part
    depends_on:
      shared-init:
        condition: service_healthy
      mongo-part:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared

  mongo-part:
    image: mongo:7.0
    volumes:
      - mongo_part_data:/data/db
    networks:
      - warranty_network

  # ===================== CAMPAIGN SERVICE =====================
  campaign-service:
    build: ./Backend/campaign-service
    ports:
      - "${PORT_CAMPAIGN}:${PORT_CAMPAIGN}"
    environment:
      - PORT=${PORT_CAMPAIGN}
      - MONGO_URI=${CAMPAIGN_DB}
      - SERVICE_NAME=campaign
    depends_on:
      shared-init:
        condition: service_healthy
      mongo-campaign:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared

  mongo-campaign:
    image: mongo:7.0
    volumes:
      - mongo_campaign_data:/data/db
    networks:
      - warranty_network

  # ===================== ANALYTICS SERVICE =====================
  analytics-service:
    build: ./Backend/analytics-service
    ports:
      - "${PORT_ANALYTICS}:${PORT_ANALYTICS}"
    environment:
      - PORT=${PORT_ANALYTICS}
      - MONGO_URI=${ANALYTICS_DB}
      - SERVICE_NAME=analytics
    depends_on:
      shared-init:
        condition: service_healthy
      mongo-analytics:
        condition: service_started
    networks:
      - warranty_network
    volumes:
      - ./Backend/shared:/shared

  mongo-analytics:
    image: mongo:7.0
    volumes:
      - mongo_analytics_data:/data/db
    networks:
      - warranty_network

# ===================== NETWORK + VOLUMES =====================
networks:
  warranty_network:
    driver: bridge

volumes:
  mongo_user_data:
  mongo_vehicle_data:
  mongo_warranty_data:
  mongo_part_data:
  mongo_campaign_data:
  mongo_analytics_data:
